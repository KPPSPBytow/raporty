<script>
function dodajZastep() {
    let container = document.getElementById("zastepy");
    let numer = document.querySelectorAll(".zastep-box").length + 1;

    let box = document.createElement("div");
    box.className = "zastep-box";

    box.innerHTML = `
<h4>Zastęp ${numer}</h4>
<label>Pojazd</label><input type="text" class="pojazd">
<label>Kierowca</label><input type="text" class="kierowca" list="obsada_list">
<label>Dowódca</label><input type="text" class="dowodca" list="obsada_list">
<label>R1</label><input type="text" class="r1" list="obsada_list">
<label>Pomocnik R1</label><input type="text" class="pr1" list="obsada_list">
<label>R2</label><input type="text" class="r2" list="obsada_list">
<label>Pomocnik R2</label><input type="text" class="pr2" list="obsada_list">
`;
    container.appendChild(box);
}
dodajZastep();

document.getElementById("kategoria").addEventListener("change", function(){
    let opcje = {
        "P - Pożar": ["Małe","Średnie","Duże","Bardzo Duże"],
        "MZ - Miejscowe Zagrożenie": ["Małe","Lokalne","Średnie","Duże"],
        "AF - Alarm Fałszywy": ["W dobrej wierze","Z instalacji wykrywania","Złośliwy"]
    };

    let datalist = document.getElementById("wielkosc_list");
    datalist.innerHTML = "";

    if(opcje[this.value]){
        opcje[this.value].forEach(x=>{
            let option = document.createElement("option");
            option.value = x;
            datalist.appendChild(option);
        });
    }
    document.getElementById("wielkosc").value = "";
});

function wyslijRaport() {

    let webhook = "https://discord.com/api/webhooks/1477367444313083965/6-KlKbKvkI3bD-59HK_iLLP136qy0qr_dPzY48IqW_VSj0qmPBU2nKld2kc60vX7ySWa";

    let zastepy = document.querySelectorAll(".zastep-box");
    let obsadaTekst = "";

    zastepy.forEach((z,i) => {
        obsadaTekst += 
`🚒 Zastęp ${i+1}
Pojazd: ${z.querySelector(".pojazd").value || "Brak"}
Kierowca: ${z.querySelector(".kierowca").value || "Brak"}
Dowódca: ${z.querySelector(".dowodca").value || "Brak"}
R1: ${z.querySelector(".r1").value || "Brak"}
Pomocnik R1: ${z.querySelector(".pr1").value || "Brak"}
R2: ${z.querySelector(".r2").value || "Brak"}
Pomocnik R2: ${z.querySelector(".pr2").value || "Brak"}

`;
    });

  let desc = `🔴 Kierujący działaniami
${document.getElementById("kierujacy").value || "Brak"}

📂 Kategoria
${document.getElementById("kategoria").value || "Nie wybrano"}

📏 Wielkość
${document.getElementById("wielkosc").value || "Nie wybrano"}

👥 Obsada PSP
${obsadaTekst || "Brak"}

📍 Lokalizacja
${document.getElementById("lokalizacja").value || "Brak"}

⏱ Przybycie
${document.getElementById("godzina_przybycia").value || "Brak"}

⏱ Zakończenie
${document.getElementById("godzina_zakonczenia").value || "Brak"}

🚒 SiŚ
${document.getElementById("zadisponowane_sis").value || "Brak"}

📝 Opis
${document.getElementById("opis").value || "Brak"}

✍️ Sporządzający
${document.getElementById("sporządzajacy_notatke").value || "Brak"}
`;

desc = desc.substring(0, 4000);

let embed = {
    title: "📋 Karta Zdarzenia",
    color: 3447003,
    description: desc,
    timestamp: new Date()
};

    fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ embeds: [embed] })
    })
    .then(() => alert("Raport wysłany!"))
    .catch(() => alert("Błąd wysyłania webhooka!"));
}
</script>
